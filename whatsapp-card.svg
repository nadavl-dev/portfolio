<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp fallback</title>
  <desc id="desc">Marketing blocked, then utility sent, then SMS backup, reaching 98 percent deliverability.</desc>

  <rect width="800" height="500" rx="24" fill="#fdf6f4"/>

  <!-- connectors -->
  <path d="M196 188 H264" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 181 L268 188 L256 195" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M396 188 H464" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M456 181 L468 188 L456 195" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 1 Marketing -->
  <circle cx="130" cy="188" r="62" fill="#fff" stroke="#e11d48" stroke-width="4"/>
  <rect x="104" y="164" width="52" height="40" rx="14" fill="#e11d48"/>
  <path d="M120 204 L112 216 L136 204" fill="#e11d48"/>
  <text x="130" y="278" text-anchor="middle" fill="#0a0a0a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Marketing</text>
  <rect x="82" y="296" width="96" height="32" rx="16" fill="#e11d48"/>
  <text x="130" y="318" text-anchor="middle" fill="#fff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Blocked</text>

  <!-- 2 Utility -->
  <circle cx="330" cy="188" r="62" fill="#fff" stroke="#25D366" stroke-width="4"/>
  <circle cx="330" cy="188" r="22" fill="#25D366"/>
  <path d="M320 188 l8 8 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="278" text-anchor="middle" fill="#0a0a0a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Utility</text>
  <rect x="286" y="296" width="88" height="32" rx="16" fill="#25D366"/>
  <text x="330" y="318" text-anchor="middle" fill="#fff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Sent</text>

  <!-- 3 SMS -->
  <circle cx="530" cy="188" r="62" fill="#fff" stroke="#2563eb" stroke-width="4"/>
  <rect x="508" y="166" width="44" height="44" rx="10" fill="#2563eb"/>
  <text x="530" y="196" text-anchor="middle" fill="#fff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">SMS</text>
  <text x="530" y="278" text-anchor="middle" fill="#0a0a0a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">SMS</text>
  <rect x="484" y="296" width="92" height="32" rx="16" fill="#2563eb"/>
  <text x="530" y="318" text-anchor="middle" fill="#fff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Backup</text>

  <!-- 98% -->
  <rect x="624" y="86" width="148" height="280" rx="28" fill="#0a0a0a"/>
  <text x="698" y="210" text-anchor="middle" fill="#fff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700">98%</text>
  <text x="698" y="248" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">delivered</text>
</svg>
